version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: portal_berita_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: portal_berita
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portal_berita_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - JWT_SECRET=super_secret_portal_berita_key_2026
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_NAME=portal_berita
      - DB_SSLMODE=disable
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portal_berita_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
